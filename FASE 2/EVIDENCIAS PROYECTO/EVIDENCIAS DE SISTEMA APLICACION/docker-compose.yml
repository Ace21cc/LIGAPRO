services:

  postgres:
    image: postgres:18
    container_name: ligapro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: liga_sin_fronteras
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ./backend
    container_name: ligapro-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: liga_sin_fronteras
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    container_name: ligapro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data: